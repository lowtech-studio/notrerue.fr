# Swap compressé en RAM plutôt qu'un fichier swap sur le NVMe (pas d'usure
# du disque, bien plus rapide qu'un swap classique) — à copier dans
# /etc/systemd/zram-generator.conf (cf. deploy/provision.sh, paquet
# systemd-zram-generator).
#
# `ram / 2` plafonné à 512 Mo : sur 1 Go de RAM, ~500 Mo de zram compressé
# (ratio ~3:1 en pratique avec zstd) donne un vrai filet de sécurité contre
# un pic mémoire ponctuel, sans prétendre remplacer de la RAM physique — le
# but est d'éviter un OOM kill brutal, pas de faire tourner l'appli en
# swap en continu (cf. vm.swappiness=10 dans deploy/sysctl/).
[zram0]
zram-size = min(ram / 2, 512)
compression-algorithm = zstd
swap-priority = 100
