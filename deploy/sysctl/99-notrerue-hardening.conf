# Durcissement réseau/noyau de base — à copier dans /etc/sysctl.d/ (cf.
# deploy/provision.sh). Rien de spécifique à l'application : les réglages
# standards recommandés pour tout serveur public exposé (ANSSI, CIS Ubuntu
# Benchmark).

# Protection contre les inondations SYN.
net.ipv4.tcp_syncookies = 1

# Un seul hôte, jamais un routeur : pas de retransmission entre interfaces.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Ignore les redirections ICMP et le routage par la source — surface
# d'attaque réseau classique, inutile sur un serveur applicatif isolé.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0

# Ignore les broadcasts ICMP (protection smurf) et les réponses erronées.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Vérification anti-usurpation d'adresse (reverse path filtering strict).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Pas de core dump pour les programmes setuid — rien ici n'en a l'usage.
fs.suid_dumpable = 0

# Swap compressé (zram, cf. deploy/zram-generator.conf) en dernier recours
# seulement, pas en usage courant : préserve la latence et l'usure du NVMe.
vm.swappiness = 10
