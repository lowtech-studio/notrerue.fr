# Réglages Postgres pour un VPS 1 vCore / 1 Go RAM / 10 Go NVMe — à copier
# dans /etc/postgresql/<version>/main/conf.d/ (cf. deploy/provision.sh).
#
# Mesuré en conditions réelles sur ce projet (cf. deploy/README.md) :
# Postgres tourne à ~40-80 Mo au repos avec les réglages *par défaut*. Les
# valeurs ci-dessous lui donnent un budget confortable (~200-250 Mo max) sans
# affamer l'application Deno ni le système — sur une machine où chaque Mo
# compte, mais sans sacrifier la durabilité des données pour autant.

listen_addresses = 'localhost'   # jamais exposé au réseau externe (cf. ufw : 5432 fermé)

# Connexions : le pool applicatif est plafonné à 5 (cf. web/db/client.ts,
# DATABASE_POOL_MAX) — 20 laisse de la marge pour psql/pg_dump/migrations
# sans réserver de mémoire pour des connexions qui n'existeront jamais
# (chaque connexion possible a un coût mémoire fixe, même inutilisée).
max_connections = 20

# Mémoire — budgets, pas des réservations immédiates, mais à garder
# cohérents avec les ~250 Mo alloués à Postgres sur 1 Go total (partagé
# avec l'appli Deno, Caddy et l'OS, cf. deploy/README.md « Budget mémoire »).
shared_buffers = 128MB
effective_cache_size = 384MB
maintenance_work_mem = 64MB
work_mem = 4MB                    # × connexions actives en pire cas : reste sous 100 Mo à 20 connexions

# WAL — petit disque (10 Go NVMe), pas besoin d'un WAL généreux pour une
# instance unique sans réplication.
wal_buffers = 4MB
min_wal_size = 80MB
max_wal_size = 512MB
checkpoint_completion_target = 0.9

# NVMe : coût de seek proche de zéro, contrairement aux valeurs par défaut
# pensées pour un disque mécanique.
random_page_cost = 1.1
effective_io_concurrency = 200

# Durabilité : jamais sacrifiée pour la performance (ANSSI/RWEB — perdre
# les données d'un habitant n'est pas un compromis acceptable ici).
synchronous_commit = on
fsync = on

# Logs au strict nécessaire (cf. AGENTS.md « éco-conception ») : seulement
# les requêtes lentes, pas un journal verbeux en continu qui userait le
# NVMe et grignoterait le disque de 10 Go pour rien.
log_min_duration_statement = 1000
log_checkpoints = off
log_connections = off
log_disconnections = off
